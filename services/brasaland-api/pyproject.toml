[project]
name = "brasaland-api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "KenHSM", email = "kennethdcastro@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "brasaland-shared",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "libpass[bcrypt]>=1.9.3",
    "openai>=3.28.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "prefect>=3,<4",
    "qdrant-client>=1.19.1",
    "tinydb>=4.9.0",
    "uvicorn[standard]>=0.53.0",
    "langchain-mcp-adapters>=0.3.2",
    "pandas>=3.0.6",
    "markitdown[pdf]>=0.1.8",
    "py-readability-metrics>=1.4.5",
    "langgraph-checkpoint-sqlite>=3.1.2",
]

[tool.uv.sources]
brasaland-shared = { path = "../../packages/shared" }

[project.scripts]
brasaland-api = "brasaland_api:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

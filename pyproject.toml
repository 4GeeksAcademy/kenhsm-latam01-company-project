[project]
name = "kenhsm-latam01-company-project"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.28.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

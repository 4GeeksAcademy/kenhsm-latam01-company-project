services:
  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
    environment:
      BRASALAND_API_URL: ${BRASALAND_API_URL}
    command: ["sh", "/app/uis/start.sh"]
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    volumes:
      - ./uis:/app/uis
      - interfaces_website_node_modules:/app/uis/website/node_modules
      - interfaces_backoffice_node_modules:/app/uis/backoffice/node_modules
    depends_on:
      backend:
        condition: service_started
    networks:
      - brasaland-dev

  backend:
    build:
      context: .
      dockerfile: ./services/Dockerfile
    env_file:
      - .env
    command: ["uvicorn", "brasaland_api.main:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8010", "--reload"]
    user: "10001:10001"
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./services/brasaland-api:/app/services/brasaland-api
      - ./data:/app/data:ro
      - brasaland_backend_state:/var/lib/brasaland
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - brasaland-dev
    environment:
      REDIS_URL: redis://redis:6379/0

  rfp-worker:
    build:
      context: .
      dockerfile: ./services/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app:/app/services/brasaland-api/src
    command: ["celery", "-A", "brasaland_api.celery_app:celery_app", "worker", "--events", "--loglevel=INFO"]
    user: "10001:10001"
    volumes:
      - ./services/brasaland-api:/app/services/brasaland-api
      - ./data:/app/data:ro
      - brasaland_backend_state:/var/lib/brasaland
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - brasaland-dev

  flower:
    build:
      context: .
      dockerfile: ./services/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app:/app/services/brasaland-api/src
    command: ["celery", "-A", "brasaland_api.celery_app:celery_app", "flower", "--address=0.0.0.0", "--port=5555"]
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - brasaland-dev

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - celery_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - brasaland-dev

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: brasaland-qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - brasaland-dev

networks:
  brasaland-dev:
    name: brasaland-dev

volumes:
  interfaces_website_node_modules:
  interfaces_backoffice_node_modules:
  qdrant_storage:
  brasaland_backend_state:
  celery_redis_data:
